# Fallback palette for the vogix SDDM theme: a neutral dark set used only
# when the NixOS module did not render theme.conf from a real vogix palette
# (nix/packages/vogix-sddm-theme.nix overwrites this file at build).
[General]
polarity=dark
font=monospace
wallpaper=
background=#181818
background_surface=#202020
background_selection=#2a2a2a
foreground_comment=#707070
foreground_border=#3a3a3a
foreground_text=#d0d0d0
foreground_heading=#e0e0e0
foreground_bright=#ffffff
success=#7a9a6a
warning=#c0904a
notice=#b0803a
danger=#c05a5a
active=#5a9aaa
link=#6a8ac0
highlight=#a07ac0
special=#c09a6a
